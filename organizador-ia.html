<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👗 Provador Virtual IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(140deg, #5e72eb, #7f53ac);
      color: #1f2937;
      min-height: 100vh;
      padding: 18px;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; margin-bottom: 18px; color: #4b5563; }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
    }
    .panel {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
    }
    .panel h2 { font-size: 1.05rem; margin-bottom: 10px; }
    .upload {
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      background: white;
    }
    .upload label { display: block; font-weight: bold; margin-bottom: 8px; }
    .upload input { width: 100%; }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .preview {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      height: 120px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      color: #6b7280;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .control { margin-bottom: 10px; }
    .control label { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }
    .control input[type="range"] { width: 100%; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .primary { background: #4f46e5; color: #fff; }
    .secondary { background: #e0e7ff; color: #3730a3; }
    .danger { background: #fee2e2; color: #991b1b; }
    .canvas-box {
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #fff;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 550px;
    }
    canvas {
      max-width: 100%;
      width: 100%;
      max-height: 80vh;
      border-radius: 10px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }
    .saved { margin-top: 14px; }
    .saved-grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .saved-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }
    .saved-card img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .saved-card a { display: block; text-align: center; padding: 5px; font-size: .8rem; color: #3730a3; text-decoration: none; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .canvas-box { min-height: 420px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>👗 Provador Virtual</h1>
    <p class="subtitle">Envie uma foto da pessoa e uma da roupa para gerar o look e salvar a imagem final.</p>

    <section class="layout">
      <aside class="panel">
        <h2>1) Upload das imagens</h2>
        <div class="upload">
          <label for="personInput">Pessoa</label>
          <input id="personInput" type="file" accept="image/*" />
        </div>
        <div class="upload">
          <label for="clothesInput">Roupa</label>
          <input id="clothesInput" type="file" accept="image/*" />
        </div>

        <div class="preview-row">
          <div class="preview" id="personPreview">Sem pessoa</div>
          <div class="preview" id="clothesPreview">Sem roupa</div>
        </div>

        <h2 style="margin-top: 14px;">2) Ajuste da roupa</h2>
        <div class="control">
          <label><span>Escala</span><strong id="scaleValue">100%</strong></label>
          <input id="scale" type="range" min="20" max="250" value="100" />
        </div>
        <div class="control">
          <label><span>Posição X</span><strong id="xValue">0</strong></label>
          <input id="offsetX" type="range" min="-300" max="300" value="0" />
        </div>
        <div class="control">
          <label><span>Posição Y</span><strong id="yValue">0</strong></label>
          <input id="offsetY" type="range" min="-300" max="300" value="0" />
        </div>
        <div class="control">
          <label><span>Rotação</span><strong id="rotationValue">0°</strong></label>
          <input id="rotation" type="range" min="-180" max="180" value="0" />
        </div>
        <div class="control">
          <label><span>Opacidade</span><strong id="opacityValue">100%</strong></label>
          <input id="opacity" type="range" min="30" max="100" value="100" />
        </div>

        <div class="actions">
          <button class="primary" id="saveBtn">💾 Salvar imagem gerada</button>
          <button class="secondary" id="resetBtn">↺ Resetar ajustes</button>
          <button class="danger" id="clearBtn">🧹 Limpar tudo</button>
        </div>
      </aside>

      <section>
        <div class="canvas-box">
          <canvas id="tryOnCanvas" width="720" height="960"></canvas>
        </div>

        <div class="saved panel">
          <h2>3) Looks salvos</h2>
          <div id="savedList" class="saved-grid"></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('tryOnCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      personImg: null,
      clothesImg: null,
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      rotation: 0,
      opacity: 1,
      savedLooks: []
    };

    const inputs = {
      personInput: document.getElementById('personInput'),
      clothesInput: document.getElementById('clothesInput'),
      scale: document.getElementById('scale'),
      offsetX: document.getElementById('offsetX'),
      offsetY: document.getElementById('offsetY'),
      rotation: document.getElementById('rotation'),
      opacity: document.getElementById('opacity')
    };

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderPreview(containerId, img) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!img) {
        container.textContent = containerId === 'personPreview' ? 'Sem pessoa' : 'Sem roupa';
        return;
      }
      const preview = document.createElement('img');
      preview.src = img.src;
      container.appendChild(preview);
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f3f4f6';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (state.personImg) {
        const ratio = Math.min(canvas.width / state.personImg.width, canvas.height / state.personImg.height);
        const w = state.personImg.width * ratio;
        const h = state.personImg.height * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(state.personImg, x, y, w, h);
      } else {
        ctx.fillStyle = '#6b7280';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Envie uma imagem da pessoa', canvas.width / 2, canvas.height / 2);
      }

      if (state.clothesImg) {
        ctx.save();
        ctx.globalAlpha = state.opacity;
        ctx.translate(canvas.width / 2 + state.offsetX, canvas.height / 2 + state.offsetY);
        ctx.rotate((state.rotation * Math.PI) / 180);

        const clothesBase = canvas.width * 0.5;
        const ratio = clothesBase / state.clothesImg.width;
        const w = state.clothesImg.width * ratio * state.scale;
        const h = state.clothesImg.height * ratio * state.scale;

        ctx.drawImage(state.clothesImg, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
    }

    function updateLabels() {
      document.getElementById('scaleValue').textContent = `${inputs.scale.value}%`;
      document.getElementById('xValue').textContent = inputs.offsetX.value;
      document.getElementById('yValue').textContent = inputs.offsetY.value;
      document.getElementById('rotationValue').textContent = `${inputs.rotation.value}°`;
      document.getElementById('opacityValue').textContent = `${inputs.opacity.value}%`;
    }

    function syncStateFromControls() {
      state.scale = Number(inputs.scale.value) / 100;
      state.offsetX = Number(inputs.offsetX.value);
      state.offsetY = Number(inputs.offsetY.value);
      state.rotation = Number(inputs.rotation.value);
      state.opacity = Number(inputs.opacity.value) / 100;
      updateLabels();
      drawCanvas();
    }

    async function handleUpload(event, type) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const img = await loadImageFromFile(file);
        if (type === 'person') {
          state.personImg = img;
          renderPreview('personPreview', img);
        } else {
          state.clothesImg = img;
          renderPreview('clothesPreview', img);
        }
        drawCanvas();
      } catch {
        alert('Não foi possível carregar a imagem. Tente outro arquivo.');
      }
    }

    function saveLook() {
      if (!state.personImg || !state.clothesImg) {
        alert('Envie as duas imagens para gerar um look.');
        return;
      }
      const dataUrl = canvas.toDataURL('image/png');
      const id = Date.now();
      state.savedLooks.unshift({ id, dataUrl });

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `look-gerado-${id}.png`;
      link.click();

      renderSavedLooks();
    }

    function renderSavedLooks() {
      const list = document.getElementById('savedList');
      if (state.savedLooks.length === 0) {
        list.innerHTML = '<p style="color:#6b7280; font-size:.9rem;">Nenhum look salvo ainda.</p>';
        return;
      }

      list.innerHTML = state.savedLooks.map(item => `
        <div class="saved-card">
          <img src="${item.dataUrl}" alt="Look salvo" />
          <a href="${item.dataUrl}" download="look-${item.id}.png">Baixar</a>
        </div>
      `).join('');
    }

    function resetControls() {
      inputs.scale.value = 100;
      inputs.offsetX.value = 0;
      inputs.offsetY.value = 0;
      inputs.rotation.value = 0;
      inputs.opacity.value = 100;
      syncStateFromControls();
    }

    function clearAll() {
      state.personImg = null;
      state.clothesImg = null;
      state.savedLooks = [];
      inputs.personInput.value = '';
      inputs.clothesInput.value = '';
      renderPreview('personPreview', null);
      renderPreview('clothesPreview', null);
      resetControls();
      renderSavedLooks();
      drawCanvas();
    }

    inputs.personInput.addEventListener('change', (e) => handleUpload(e, 'person'));
    inputs.clothesInput.addEventListener('change', (e) => handleUpload(e, 'clothes'));
    Object.values(inputs).slice(2).forEach(input => input.addEventListener('input', syncStateFromControls));

    document.getElementById('saveBtn').addEventListener('click', saveLook);
    document.getElementById('resetBtn').addEventListener('click', resetControls);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    renderSavedLooks();
    syncStateFromControls();
  </script>
</body>
</html>
